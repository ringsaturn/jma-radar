[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jma-radar"
version = "0.2.0"
description = "Build pseudo composite-reflectivity (dBZ) grids from JMA high-resolution precipitation nowcast tiles"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ringsaturn" }]
keywords = ["jma", "radar", "weather", "nowcast", "reflectivity", "netcdf"]
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "httpx>=0.27",
    "xarray>=2024.1",
    "netcdf4>=1.6",
    "typer>=0.12",
]

[project.optional-dependencies]
geotiff = ["rasterio>=1.3"]
plot = ["matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/ringsaturn/jma-radar"
Issues = "https://github.com/ringsaturn/jma-radar/issues"

[project.scripts]
jma-radar = "jma_radar.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jma_radar"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that hit the live JMA servers (deselected by default)"]
addopts = "-m 'not network'"

[tool.mypy]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["rasterio.*", "matplotlib.*", "netCDF4.*"]
ignore_missing_imports = true
